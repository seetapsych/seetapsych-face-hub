  - uid: 8e646eec-e50f-4102-a658-1449d04296fb
    name: FaceMesh-MediaPipe
    description: 468-point normalized 3D face mesh landmark extraction from detected face boxes with optional blendshapes and pose matrices
    version: '1.0'
    usage_models: []
    inputs: []
    provides:
      - face/mesh
    requires:
      - face/detection
    entry:
      method: seetapsych_face_hub.mediapipe.face_landmarker.package.load
    parameters:
      - name: running_mode
        type: selection
        value: IMAGE
        selection: [IMAGE, VIDEO, LIVE_STREAM]
        text: Running Mode
        description: Task execution mode. VIDEO/LIVE_STREAM enable temporal landmark smoothing when num_faces = 1.
      - name: num_faces
        type: integer
        value: 1
        text: Max Num Faces
        description: Maximum number of faces to landmark simultaneously. Smoothing is only active when num_faces is 1.
      - name: min_face_detection_confidence
        type: number
        value: 0.5
        text: Min Face Detection Confidence
        description: Minimum confidence for the built-in face detector to succeed when initializing landmark placement.
      - name: min_face_presence_confidence
        type: number
        value: 0.5
        text: Min Face Presence Confidence
        description: Minimum confidence that a face is present in the frame before landmark output; filters intermittent dropouts in video.
      - name: min_tracking_confidence
        type: number
        value: 0.5
        text: Min Tracking Confidence
        description: Minimum tracking confidence to reuse the last known face position vs. re-running full detection. Higher values reduce drift but trigger re-detection more often.
      - name: output_face_blendshapes
        type: boolean
        value: false
        text: Output Face Blendshapes
        description: Whether to output 52 face blendshape coefficients for 3D avatar/AR rendering. Adds minor compute overhead.
      - name: output_facial_transformation_matrixes
        type: boolean
        value: false
        text: Output Facial Pose Matrices
        description: Whether to output 4x4 facial pose transformation matrices for rigid head pose estimation.
    models:
      - uid: 5293454d-2060-4350-ad22-ab6a24207878
        name: face_landmarker.task
        version: '1.0'
        recommended: true
        download:
          index: face_landmarker.task
