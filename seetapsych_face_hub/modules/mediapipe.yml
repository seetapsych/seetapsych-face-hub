          url: https://www.modelscope.cn/models/levalup/cloud-models/resolve/master/mediapipe/face_detector/blaze_face_full_range_sparse.tflite
      - uid: d36eeeec-5d0c-4a83-b420-d2709c06bd35
        name: blaze_face_short_range.tflite
        version: '1.0'
        download:
          index: blaze_face_short_range.tflite
          sha256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f
