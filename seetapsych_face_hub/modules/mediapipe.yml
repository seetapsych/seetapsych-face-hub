version: '1.0'
module:
  uid: 19da81a5-6c9f-4a7b-b388-86f9e03dc6c1
  name: MediaPipe
  version: '1.0'
  description: 'MediaPipe Tasks face detection and 468-point 3D face mesh landmarking via BlazeFace short/full-range models.'
  keywords:
    - Face
    - Detection
    - Landmarks
    - Face Mesh
  requirements:
    - seetapsych-face-hub
    - mediapipe>=0.10.33
packages:
  - uid: 56d8a9a9-0ad9-4d90-ad3f-ffc2f51c1597
    name: FaceDetection-MediaPipe
    description: Face bounding box detection via MediaPipe BlazeFace detector with short/full-range/sparse model variants
    version: '1.0'
    usage_models: []
    inputs: []
    provides:
      - face/detection
    requires: []
    entry:
      method: seetapsych_face_hub.mediapipe.face_detector.package.load
    parameters:
      - name: running_mode
        type: selection
        value: IMAGE
        selection: [IMAGE, VIDEO, LIVE_STREAM]
        text: Running Mode
        description: Task execution mode. IMAGE for single static frames; VIDEO/LIVE_STREAM for time-series smoothing across frames.
      - name: min_detection_confidence
        type: number
        value: 0.5
        text: Min Detection Confidence
        description: Minimum confidence score for a detection box to be returned. Lower values catch more faces at the cost of false positives.
      - name: min_suppression_threshold
        type: number
        value: 0.3
        text: Min Suppression Threshold
        description: IoU threshold for non-maximum suppression. Higher values keep more overlapping boxes; lower values prune aggressively.
    models:
