  - uid: 8e646eec-e50f-4102-a658-1449d04296fb
    name: MediaPipe Face Mesh
    version: 0.0.1
    usage_models: []
    inputs: []
    provides:
      - face/mesh
    requires:
      - face/detection
    entry:
      method: seetapsych_face_hub.mediapipe.face_landmarker.package.load
    parameters:
      - name: running_mode
        type: selection
        value: IMAGE
        selection: [IMAGE, VIDEO, LIVE_STREAM]
        description: Sets the running mode for the task. [IMAGE, VIDEO, LIVE_STREAM].
      - name: num_faces
        type: integer
        value: 1
        description: The maximum number of faces that can be detected by the the FaceLandmarker. Smoothing is only applied when num_faces is set to 1.
      - name: min_face_detection_confidence
        type: number
        value: 0.5
        description: The minimum confidence score for the face detection to be considered successful.
      - name: min_face_presence_confidence
        type: number
        value: 0.5
        description: The minimum confidence score of face presence score in the face landmark detection.
      - name: min_tracking_confidence
        type: number
        value: 0.5
        description: The minimum confidence score for the face tracking to be considered successful.
      - name: output_face_blendshapes
        type: boolean
        value: false
        description: Whether Face Landmarker outputs face blendshapes. Face blendshapes are used for rendering the 3D face model.
      - name: output_facial_transformation_matrixes
        type: boolean
        value: false
        description: Whether FaceLandmarker outputs the facial transformation matrix. FaceLandmarker uses the matrix to transform the face landmarks from a canonical face model to the detected face, so users can apply effects on the detected landmarks.
